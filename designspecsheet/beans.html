<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span {
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
        }
        #tag-html {
            background-color: #FF6B6B;
            color: white;
        } 
        #tag-css {
            background-color: #4EC0C4;
            color: white;
        } 
        #tag-js {
            background-color: #FFE66D;
            color: #333;
        } 
        #tag-py {
            background-color: #A8E6CF;
            color: #333;
        } 
        
    </style>
</head>
<body>
    <div>
        <span id="tag-html">HTML</span>
        <span id="tag-css">CSS</span>
        <span id="tag-js">JS</span>
        <span id="tag-py">Python</span>
    </div>
</body>
</html>
